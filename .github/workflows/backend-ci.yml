
name: Backend CI

on:
  push:
    branches:
      - "**"

  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  backend-ci:
    name: Backend Checks and Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine

        env:
          POSTGRES_DB: habitree_ci
          POSTGRES_USER: habitree_ci
          POSTGRES_PASSWORD: ci_test_password

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U habitree_ci -d habitree_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SECRET_KEY: ci-only-secret-key
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1

      POSTGRES_DB: habitree_ci
      POSTGRES_USER: habitree_ci
      POSTGRES_PASSWORD: ci_test_password

      DB_HOST: 127.0.0.1
      DB_PORT: "5432"

      CORS_ALLOWED_ORIGINS: http://localhost:5173

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check

      - name: Check migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Apply migrations
        run: python manage.py migrate --noinput

      - name: Run tests
        run: python -m pytest -v --ds=Backend.settings

      - name: Create temporary environment for Docker Compose
        run: |
          cat > .env <<'EOF'
          DJANGO_SECRET_KEY=ci-only-secret-key
          DJANGO_DEBUG=0
          DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1
          POSTGRES_DB=habitree_ci
          POSTGRES_USER=habitree_ci
          POSTGRES_PASSWORD=ci_test_password
          DB_HOST=db
          DB_PORT=5432
          CORS_ALLOWED_ORIGINS=http://localhost:5173
          EOF

      - name: Validate Docker Compose
        run: docker compose config -q

      - name: Build Docker image
        run: docker compose build backend
